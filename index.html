function useWindowWidth() {
  const [w, setW] = React.useState(typeof window !== "undefined" ? window.innerWidth : 1200);
  React.useEffect(() => {
    const fn = () => setW(window.innerWidth);
    window.addEventListener("resize", fn, { passive: true });
    return () => window.removeEventListener("resize", fn);
  }, []);
  return w;
}

function useReveal() {
  const ref = React.useRef(null);
  const [seen, setSeen] = React.useState(false);
  React.useEffect(() => {
    if (!ref.current || seen) return;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } });
      },
      { threshold: 0.1 }
    );
    io.observe(ref.current);
    return () => io.disconnect();
  }, [seen]);
  return [ref, seen];
}

function Reveal({ children, delay = 0, y = 24, style, ...rest }) {
  const [ref, seen] = useReveal();
  return (
    <div
      ref={ref}
      style={{
        opacity: seen ? 1 : 0,
        transform: seen ? "translateY(0)" : `translateY(${y}px)`,
        transition: `opacity 800ms cubic-bezier(.2,.7,.2,1) ${delay}ms, transform 900ms cubic-bezier(.2,.7,.2,1) ${delay}ms`,
        ...style
      }}
      {...rest}
    >
      {children}
    </div>
  );
}

function DriftingNotes({ count = 14, color = "#83B0B8", opacity = 0.18 }) {
  const notes = React.useMemo(() => {
    const glyphs = ["♪", "♩", "♫", "♬", "𝄞", "♭", "♯"];
    return Array.from({ length: count }).map((_, i) => ({
      g: glyphs[i % glyphs.length],
      left: (i * 7.3 + 3) % 100,
      size: 18 + (i * 13.7) % 36,
      dur: 18 + (i * 11.3) % 18,
      delay: -(i * 5.7) % 30,
      sway: 20 + (i * 9.1) % 40,
    }));
  }, [count]);
  return (
    <div style={{ position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none", zIndex: 0 }}>
      {notes.map((n, i) => (
        <span
          key={i}
          style={{
            position: "absolute",
            left: `${n.left}%`,
            bottom: "-60px",
            fontSize: `${n.size}px`,
            color,
            opacity,
            animation: `pcDrift ${n.dur}s linear ${n.delay}s infinite, pcSway ${n.dur / 2}s ease-in-out ${n.delay}s infinite alternate`,
            ["--sway"]: `${n.sway}px`,
            fontFamily: 'Imbue, "Cormorant Garamond", serif',
          }}
        >
          {n.g}
        </span>
      ))}
    </div>
  );
}

function MiniPiano() {
  const winW = useWindowWidth();
  const width = Math.min(620, winW - 40);

  const ctxRef = React.useRef(null);
  const getCtx = () => {
    if (!ctxRef.current) {
      try { ctxRef.current = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    return ctxRef.current;
  };
  const play = (freq) => {
    const ac = getCtx();
    if (!ac) return;
    if (ac.state === "suspended") ac.resume();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = "triangle";
    o.frequency.value = freq;
    g.gain.value = 0;
    o.connect(g).connect(ac.destination);
    const t = ac.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
    o.start(t);
    o.stop(t + 1.2);
  };

  const whites = [
    { n: "C",  f: 261.63, label: "do" },
    { n: "D",  f: 293.66, label: "re" },
    { n: "E",  f: 329.63, label: "mi" },
    { n: "F",  f: 349.23, label: "fa" },
    { n: "G",  f: 392.00, label: "sol" },
    { n: "A",  f: 440.00, label: "la" },
    { n: "B",  f: 493.88, label: "ti" },
    { n: "C2", f: 523.25, label: "do" },
  ];
  const blacks = [
    { n: "C#", f: 277.18, after: 0 },
    { n: "D#", f: 311.13, after: 1 },
    { n: "F#", f: 369.99, after: 3 },
    { n: "G#", f: 415.30, after: 4 },
    { n: "A#", f: 466.16, after: 5 },
  ];

  const wKeyW = width / whites.length;
  const wKeyH = wKeyW * 3.6;
  const bKeyW = wKeyW * 0.62;
  const bKeyH = wKeyH * 0.6;
  const [pressed, setPressed] = React.useState(null);
  const tap = (k) => { setPressed(k); play(k.f); setTimeout(() => setPressed(null), 220); };

  return (
    <div style={{ position: "relative", width, height: wKeyH, filter: "drop-shadow(0 18px 28px rgba(1,15,20,.18))" }}>
      <div style={{ display: "flex", width: "100%", height: wKeyH, borderRadius: "6px 6px 10px 10px", overflow: "hidden", border: `1.5px solid ${C.ink}` }}>
        {whites.map((k, i) => (
          <button
            key={k.n}
            onClick={() => tap(k)}
            style={{
              flex: 1,
              background: pressed && pressed.n === k.n ? C.accent : "#FBF7EE",
              cursor: "pointer",
              position: "relative",
              transition: "background 120ms ease",
              padding: 0,
              fontFamily: '"Cormorant Garamond", Imbue, serif',
              fontStyle: "italic",
              color: C.ink + "88",
              fontSize: Math.max(10, wKeyW * 0.28),
              paddingBottom: 8,
              display: "flex",
              alignItems: "flex-end",
              justifyContent: "center",
              border: "none",
              borderRight: i < whites.length - 1 ? `1px solid ${C.ink}33` : "none",
            }}
          >
            {k.label}
          </button>
        ))}
      </div>
      {blacks.map((k) => (
        <button
          key={k.n}
          onClick={() => tap(k)}
          style={{
            position: "absolute",
            top: 0,
            left: `${((k.after + 1) / whites.length) * 100}%`,
            transform: `translateX(-50%)`,
            width: `${(bKeyW / width) * 100}%`,
            height: bKeyH,
            background: pressed && pressed.n === k.n ? C.accent : C.ink,
            borderRadius: "0 0 4px 4px",
            border: "none",
            cursor: "pointer",
            boxShadow: "inset 0 -4px 0 rgba(0,0,0,.4)",
            transition: "background 120ms ease",
            padding: 0,
          }}
          aria-label={k.n}
        />
      ))}
    </div>
  );
}

// ─── Mount ────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Page />);

</script>
